services:
  - type: web
    name: internal-ai-chat-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: 350
      - key: UPLOAD_PART_SIZE_MB
        value: 16
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: lax
      - key: EMBEDDING_PROVIDER_ID
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small

  - type: worker
    name: internal-ai-chat-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/workers/file-processing.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: 350
      - key: UPLOAD_PART_SIZE_MB
        value: 16
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: lax
      - key: EMBEDDING_PROVIDER_ID
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
